<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube blocked</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #272136; background: radial-gradient(circle, rgba(207, 232, 214, 1) 22%, rgba(255, 219, 232, 1) 46%, rgba(159, 245, 195, 1) 64%, rgba(232, 158, 184, 1) 83%, rgba(146, 209, 117, 1) 100%); }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { max-width: 440px; padding: 32px; border-radius: 16px; background: #ffdbe8; text-align: center; }
      img { width: 56px; height: 56px; }
      h1 { margin: 12px 0; font-size: 1.5rem; }
      p { margin: 0 0 24px; line-height: 1.5; }
      a { display: inline-block; padding: 10px 16px; border-radius: 8px; background: #9ff5c3; color: #272136; font-weight: 600; text-decoration: none; }
      a:hover { background: #92d175; }
      a:focus-visible { outline: 2px solid #365844; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="heartbloom_icon.png" alt="" />
      <h1>YouTube is blocked</h1>
      <p>You've turned on the YouTube blocker. Open your blocker settings whenever you want to change it.</p>
      <a href="index.html#/distraction-blockers">Open blocker settings</a>
    </main>
  </body>
</html>
