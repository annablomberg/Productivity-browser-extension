<title id="title">Pixel plant — life and wilt</title>
<desc id="desc">An original fantasy pixel-art plant in a terracotta pot. Golden sparkles twinkle behind its green leaves, which gradually yellow, droop, and turn brown over a sixteen-second loop. Transparent background.</desc>
